<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#1f2a3a"/><stop offset="1" stop-color="#07090d"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3dd6ff"/><stop offset=".55" stop-color="#c6ff3d"/><stop offset="1" stop-color="#ff5d5d"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fb"/><stop offset="1" stop-color="#9aa4b6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- speed arc -->
  <path d="M106 300 A150 150 0 0 1 406 300" fill="none" stroke="#1b2230" stroke-width="34" stroke-linecap="round"/>
  <path d="M106 300 A150 150 0 0 1 406 300" fill="none" stroke="url(#arc)" stroke-width="34" stroke-linecap="round" filter="url(#glow)"/>
  <!-- ticks -->
  <g stroke="#0b0e13" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="133" x2="256" y2="167"/>
    <line x1="150" y1="194" x2="174" y2="218"/>
    <line x1="362" y1="194" x2="338" y2="218"/>
  </g>
  <!-- needle -->
  <g filter="url(#glow)">
    <path d="M256 300 L352 196" stroke="#c6ff3d" stroke-width="16" stroke-linecap="round"/>
  </g>
  <circle cx="256" cy="300" r="24" fill="#c6ff3d"/>
  <circle cx="256" cy="300" r="10" fill="#07090d"/>
  <!-- barbell -->
  <rect x="64" y="372" width="384" height="16" rx="8" fill="#9aa4b6"/>
  <rect x="96" y="334" width="34" height="92" rx="10" fill="url(#plate)"/>
  <rect x="134" y="350" width="22" height="60" rx="8" fill="url(#plate)"/>
  <rect x="382" y="334" width="34" height="92" rx="10" fill="url(#plate)"/>
  <rect x="356" y="350" width="22" height="60" rx="8" fill="url(#plate)"/>
  <rect x="160" y="366" width="10" height="28" rx="3" fill="#c6ff3d"/>
  <rect x="342" y="366" width="10" height="28" rx="3" fill="#c6ff3d"/>
</svg>
